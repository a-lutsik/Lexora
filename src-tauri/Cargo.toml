[package]
name = "lexora"
version = "0.1.0"
description = "Lexora — AI Language Learning Desktop Assistant"
authors = ["Lexora Team"]
edition = "2021"

[lib]
name = "lexora_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri ──────────────────────────────────────────────────
tauri           = { version = "2", features = ["macos-private-api", "tray-icon", "image-ico", "image-png", "protocol-asset"] }
tauri-plugin-store  = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification    = "2"
tauri-plugin-shell  = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"

# ── Serialization ──────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Database ───────────────────────────────────────────────
rusqlite   = { version = "0.31", features = ["bundled", "serde_json"] }
r2d2       = "0.8"
r2d2_sqlite = "0.24"
refinery   = { version = "0.8", features = ["rusqlite"] }

# ── Async ──────────────────────────────────────────────────
tokio      = { version = "1", features = ["full"] }
async-trait = "0.1"

# ── Error handling ─────────────────────────────────────────
thiserror  = "1"
anyhow     = "1"

# ── HTTP client (for AI providers) ────────────────────────
reqwest    = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
url        = "2"
base64     = "0.22"

# ── Realtime voice (Gemini Live WebSocket) ────────────────
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# ── Logging ────────────────────────────────────────────────
log        = "0.4"
env_logger = "0.11"

# ── Utilities ──────────────────────────────────────────────
uuid       = { version = "1", features = ["v4"] }
chrono     = { version = "0.4", features = ["serde"] }
sha2       = "0.10"   # For media cache hashing

# ── macOS System Services (NSServices) ──────────────────────
# Версии подобраны под дерево зависимостей tauri/tao/wry
# (см. Cargo.lock: objc2 0.6.4, objc2-foundation/objc2-app-kit 0.3.2),
# чтобы типы NSApplication совпадали с транзитивными.
[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSObject", "NSString", "NSProcessInfo", "NSArray"] }
objc2-app-kit    = { version = "0.3.2", features = ["NSApplication", "NSPasteboard", "NSResponder", "NSWindow", "NSView", "NSEvent", "NSScreen", "NSColor", "NSRunningApplication", "NSWorkspace", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
core-foundation  = "0.10"
core-graphics    = "0.25"
# Non-activating NSPanel: a popup that appears on the current Space (also over
# full-screen apps) without activating Lexora and pulling the user to its Space.
tauri-nspanel    = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "ef6e3090a6083c653955ca0b6e7f6c6ae1453d40" }

# ── Windows UI Automation (writing check in other apps) ────
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3
panic         = "abort"
strip         = true

[profile.dev]
# Faster dev builds
opt-level = 1
